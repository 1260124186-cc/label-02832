services:
  # 管理后台前端服务
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    image: jd-mall-frontend-admin:latest
    container_name: jd-mall-frontend-admin
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - jd-network
    labels:
      - "app.name=jd-mall-frontend-admin"
      - "app.description=京东商城管理后台前端"
      - "app.version=1.0.0"

networks:
  jd-network:
    driver: bridge
